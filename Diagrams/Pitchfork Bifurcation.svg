<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Drempel / Vonk Pitchfork Bifurcation — Van to Naar mode transition</title>
  <desc id="desc">
    Bifurcation diagram of the order parameter φ against binding B for the Speelgoed's Drempel mechanism.
    Below the threshold θ, the only stable mode is φ = 0, labeled Van. Above θ, φ = 0 becomes unstable,
    and two stable Naar modes emerge at φ = ±√(B − θ). The crossing at B = θ fires a Vonk q, releasing
    energy T = ¼(B − θ)². Definitions, key behavior, and the threshold value θ = 4 are included.
    This visual corresponds to Section VIII.3 of the Speelgoed.
  </desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#141426"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg     { fill: url(#bgGrad); }
      .axis   { stroke: #8892b0; stroke-width: 1.8; }
      .grid   { stroke: #334; stroke-dasharray: 2 4; }
      .label  { fill: #a8b2d1; font-family: sans-serif; font-size: 14px; }
      .titlex { fill: #e6f1ff; font-family: sans-serif; font-size: 22px; font-weight: bold; }
      .subtle { fill: #8892b0; font-family: sans-serif; font-size: 14px; }
      .curve  { fill: none; stroke-width: 3.5; filter: url(#glow); opacity: 0.95; }
      .solidstable { stroke: #00d4ff; }
      .unstable    { stroke: #ff5555; stroke-dasharray: 6 6; }
      .upperbranch { stroke: #ffcc66; }
      .lowerbranch { stroke: #ff66aa; }
      .annot  { fill: #ff4d6d; font-family: sans-serif; font-size: 15px; font-weight: bold; }
      .panel  { fill: #15152a; stroke: #334; stroke-width: 1.2; rx: 12; }
      .phead  { fill: #00d4ff; font-family: sans-serif; font-size: 15px; font-weight: bold; }
      .ptext  { fill: #ccd6f6; font-family: sans-serif; font-size: 13px; }
      .pmute  { fill: #8892b0; font-family: sans-serif; font-size: 13px; font-style: italic; }
      .mono   { fill: #e6f1ff; font-family: monospace; font-size: 13px; }
      .form   { fill: #e6f1ff; font-family: sans-serif; font-size: 17px; font-weight: bold; }
    </style>
  </defs>

  <!-- background -->
  <rect class="bg" width="1000" height="720" rx="12"/>

  <!-- main title -->
  <text class="titlex" x="500" y="45" text-anchor="middle">Drempel / Vonk Pitchfork Bifurcation</text>
  <text class="subtle" x="500" y="68" text-anchor="middle">Stability change at the Drempel θ — Section VIII.3</text>

  <!-- plot area -->
  <!-- axes -->
  <line class="axis" x1="120" y1="100" x2="120" y2="520"/>
  <line class="axis" x1="120" y1="520" x2="620" y2="520"/>

  <!-- horizontal grid and φ labels -->
  <g class="grid">
    <line x1="120" y1="142" x2="620" y2="142"/> <!-- φ = 2 -->
    <line x1="120" y1="226" x2="620" y2="226"/> <!-- φ = 1 -->
    <line x1="120" y1="310" x2="620" y2="310"/> <!-- φ = 0 -->
    <line x1="120" y1="394" x2="620" y2="394"/> <!-- φ = -1 -->
    <line x1="120" y1="478" x2="620" y2="478"/> <!-- φ = -2 -->
  </g>
  <g class="label" text-anchor="end">
    <text x="110" y="146">2</text>
    <text x="110" y="230">1</text>
    <text x="110" y="314">0</text>
    <text x="110" y="398">−1</text>
    <text x="110" y="482">−2</text>
  </g>

  <!-- x ticks and labels -->
  <g class="label" text-anchor="middle">
    <text x="120" y="544">0</text>
    <text x="220" y="544">2</text>
    <text x="320" y="544">4</text>
    <text x="420" y="544">6</text>
    <text x="520" y="544">8</text>
    <text x="620" y="544">10</text>
  </g>

  <!-- axis titles -->
  <text class="subtle" x="370" y="580" text-anchor="middle">Binding (B)</text>
  <text class="subtle" x="50" y="310" text-anchor="middle" transform="rotate(-90 50 310)">Order parameter (φ)</text>

  <!-- threshold line at B = θ = 4 -->
  <line x1="320" y1="100" x2="320" y2="520" stroke="#ffcc66" stroke-dasharray="6 6" stroke-width="1.8" opacity="0.8"/>
  <text class="annot" x="325" y="95" fill="#ffcc66">θ = 4</text>

  <!-- stable Van mode φ = 0 for B < θ -->
  <line class="curve solidstable" x1="120" y1="310" x2="320" y2="310"/>
  <text class="subtle" x="200" y="290" fill="#00d4ff">Van mode (φ = 0)</text>

  <!-- unstable φ = 0 for B > θ -->
  <line class="curve unstable" x1="320" y1="310" x2="620" y2="310"/>
  <text class="subtle" x="470" y="295" fill="#ff5555">unstable</text>

  <!-- upper stable Naar branch -->
  <polyline class="curve upperbranch" points="
    320,310
    345,250.6
    370,226
    395,207.1
    420,191.2
    445,177.2
    470,164.5
    495,152.8
    520,142
    545,131.8
    570,122.2
    595,113.0
    620,104.3
  "/>

  <!-- lower stable Naar branch -->
  <polyline class="curve lowerbranch" points="
    320,310
    345,369.4
    370,394
    395,412.9
    420,428.8
    445,442.8
    470,455.5
    495,467.2
    520,478
    545,488.2
    570,497.8
    595,507.0
    620,515.7
  "/>

  <!-- labels for branches -->
  <text class="subtle" x="625" y="118" fill="#ffcc66">Naar (φ⁺)</text>
  <text class="subtle" x="625" y="502" fill="#ff66aa">Naar (φ⁻)</text>

  <!-- crossing point and Vonk -->
  <circle cx="320" cy="310" r="6" fill="#ffffff" filter="url(#glow)"/>
  <text class="annot" x="335" y="300" fill="#ffffff">Vonk (q)</text>

  <!-- energy formula inside plot -->
  <text class="form" x="140" y="130" fill="#ffcc66">T = ¼(B − θ)²</text>

  <!-- right explanatory panel -->
  <rect class="panel" x="660" y="85" width="320" height="605"/>

  <!-- Definitions -->
  <text class="phead" x="680" y="115">DEFINITIONS</text>
  <text class="ptext" x="680" y="138">Drempel (θ):</text>
  <text class="ptext" x="680" y="156">local threshold on a spectrum.</text>
  <text class="ptext" x="680" y="174">Decides which pole applies.</text>

  <text class="ptext" x="680" y="202">Vonk (q):</text>
  <text class="ptext" x="680" y="220">event fired automatically</text>
  <text class="ptext" x="680" y="238">at the instant B crosses θ.</text>

  <!-- Energy release -->
  <text class="phead" x="680" y="268">ENERGY RELEASE</text>
  <text class="form" x="680" y="290">T = ¼(B − θ)²</text>
  <text class="ptext" x="680" y="312">Convergence crossing:</text>
  <text class="ptext" x="680" y="330">Gewaarwording (φ) — Winst (+)</text>
  <text class="ptext" x="680" y="348">Divergence crossing:</text>
  <text class="ptext" x="680" y="366">Schok (:) — Verlies (−)</text>

  <!-- Key behavior -->
  <text class="phead" x="680" y="396">KEY BEHAVIOR</text>
  <text class="ptext" x="680" y="414">For B &lt; θ, only stable state</text>
  <text class="ptext" x="680" y="432">is Van mode: φ = 0.</text>
  <text class="ptext" x="680" y="450">For B &gt; θ, φ = 0 becomes</text>
  <text class="ptext" x="680" y="468">unstable, and two stable</text>
  <text class="ptext" x="680" y="486">Naar modes appear at</text>
  <text class="ptext" x="680" y="504">φ = ±√(B − θ).</text>

  <text class="pmute" x="680" y="534">The crossing is not a</text>
  <text class="pmute" x="680" y="552">label change.</text>
  <text class="pmute" x="680" y="570">It is a stability change.</text>

  <!-- Final insight -->
  <text class="pmute" x="680" y="610">A Drempel is not a rule.</text>
  <text class="pmute" x="680" y="628">It is the shape of the field.</text>
</svg>