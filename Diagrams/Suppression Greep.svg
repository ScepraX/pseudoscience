<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title" aria-describedby="desc" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif">
  <title id="title">Van Motor suppression by Greep: L = L₀ · exp(−J)</title>
  <desc id="desc">Two graphs of the same law, L = L₀ · exp(−J), from Sections III and VIII.1 of the Speelgoed. Greep J is a node’s total resonant binding: the sum of its positive-Trouw bonds, weighted by Gewenning. L is the Van Motor coefficient, strictly positive for every node at every moment. Left, on a linear scale, L falls from L₀ toward zero and seems to touch it: at J = 6 it is still about 0.25% of L₀. Right, on a logarithmic scale, the same law is a straight line with no floor; zero is not on that axis at all. Doubling J squares L/L₀: exp(−4) = (exp(−2))². Suppressed, never abolished: Greep does not remove the fall; it postpones it.</desc>
