<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title" aria-describedby="desc" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif">
  <title id="title">The Wijk: L ∝ exp(−η / ‖υ‖), suppressed, never abolished</title>
  <desc id="desc">Two graphs of the same law, L ∝ exp(−η / ‖υ‖), from Sections VI.4, XV and XIX of the Speelgoed. L, the Wijk, is a Relatie’s yield to Stilte’s Trek: the rate at which Vervorming carries it back over the Marge that holds it. η is its least Marge, and ‖υ‖ the strength of the Vervorming its Echoes carry, which is never zero. Left, on a linear scale, L falls from L₀ toward zero and seems to touch it: at η/‖υ‖ = 6 it is still about 0.25% of L₀. Right, on a logarithmic scale, the same law is a straight line with no floor; zero is not on that axis at all. Doubling the Marge squares L/L₀: exp(−4) = (exp(−2))². Greep keeps the Marge deep and quickens its Tijd, and lowers the Wijk without ever bringing it to zero: Stilte’s Trek is never off.</desc>
