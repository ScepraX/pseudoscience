<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Van Motor coefficient ν as a function of Greep J — Suppression Greep</title>
  <desc id="desc">
    Linear-scale graph of the exponential law ν = ν₀ · e^(−J).
    Greep J is the total resonant binding: the sum of positive-Trouw bonds weighted by Gewenning Z.
    ν is the Van Motor coefficient, the strength of the standing pull toward the unbound Van pole.
    The curve starts at ν₀ = 1 when J = 0 and decays exponentially toward zero.
    It approaches but never reaches the horizontal axis; the dashed line at ν = 0 is an asymptote.
    Key phrase: "Suppressed — never abolished."
    This visual corresponds to Section III and Section VIII.1 of the Speelgoed.
  </desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#141426"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg     { fill: url(#bgGrad); }
      .axis   { stroke: #8892b0; stroke-width: 1.8; }
      .grid   { stroke: #334; stroke-dasharray: 2 4; }
      .label  { fill: #a8b2d1; font-family: sans-serif; font-size: 14px; }
      .titlex { fill: #e6f1ff; font-family: sans-serif; font-size: 22px; font-weight: bold; }
      .subtle { fill: #8892b0; font-family: sans-serif; font-size: 14px; }
      .curve  { fill: none; stroke: url(#curveGrad); stroke-width: 4; filter: url(#glow); opacity: 0.95; }
      .annot  { fill: #ff4d6d; font-family: sans-serif; font-size: 15px; font-weight: bold; }
      .panel  { fill: #15152a; stroke: #334; stroke-width: 1.2; rx: 12; }
      .phead  { fill: #00d4ff; font-family: sans-serif; font-size: 15px; font-weight: bold; }
      .ptext  { fill: #ccd6f6; font-family: sans-serif; font-size: 13px; }
      .pmute  { fill: #8892b0; font-family: sans-serif; font-size: 13px; font-style: italic; }
      .mono   { fill: #e6f1ff; font-family: monospace; font-size: 13px; }
      .form   { fill: #e6f1ff; font-family: sans-serif; font-size: 17px; font-weight: bold; }
    </style>
  </defs>

  <!-- background -->
  <rect class="bg" width="1000" height="720" rx="12"/>

  <!-- main title -->
  <text class="titlex" x="500" y="45" text-anchor="middle">Van Motor Suppression by Greep</text>
  <text class="subtle" x="500" y="68" text-anchor="middle">Linear-scale graph of the exponential law — Section III / VIII.1</text>

  <!-- plot area -->
  <!-- axes -->
  <line class="axis" x1="120" y1="100" x2="120" y2="520"/>
  <line class="axis" x1="120" y1="520" x2="620" y2="520"/>

  <!-- horizontal grid and y labels -->
  <g class="grid">
    <line x1="120" y1="100" x2="620" y2="100"/>
    <line x1="120" y1="184" x2="620" y2="184"/>
    <line x1="120" y1="268" x2="620" y2="268"/>
    <line x1="120" y1="352" x2="620" y2="352"/>
    <line x1="120" y1="436" x2="620" y2="436"/>
  </g>
  <g class="label" text-anchor="end">
    <text x="110" y="104">1.0</text>
    <text x="110" y="188">0.8</text>
    <text x="110" y="272">0.6</text>
    <text x="110" y="356">0.4</text>
    <text x="110" y="440">0.2</text>
    <text x="110" y="524">0.0</text>
  </g>

  <!-- x ticks and labels -->
  <g class="label" text-anchor="middle">
    <text x="120" y="544">0</text>
    <text x="220" y="544">2</text>
    <text x="320" y="544">4</text>
    <text x="420" y="544">6</text>
    <text x="520" y="544">8</text>
    <text x="620" y="544">10</text>
  </g>

  <!-- axis titles -->
  <text class="subtle" x="370" y="580" text-anchor="middle">Greep (J)</text>
  <text class="subtle" x="50" y="310" text-anchor="middle" transform="rotate(-90 50 310)">Van Motor coefficient (ν)</text>

  <!-- asymptote at ν = 0 -->
  <line x1="120" y1="520" x2="620" y2="520" stroke="#ff5555" stroke-dasharray="6 6" stroke-width="1.8" opacity="0.8"/>
  <text class="annot" x="130" y="545">ν = 0 asymptote — never reached</text>

  <!-- exponential curve: ν = exp(-J), J from 0 to 10 -->
  <polyline class="curve" points="
    120,100
    145,265.3
    170,365.5
    195,426.3
    220,463.2
    245,485.5
    270,499.1
    295,507.3
    320,512.3
    345,515.3
    370,517.2
    395,518.3
    420,519.0
    445,519.4
    470,519.6
    495,519.8
    520,519.9
    545,520.0
    570,520.0
    595,520.0
    620,520.0
  "/>

  <!-- start point -->
  <circle cx="120" cy="100" r="5" fill="#00d4ff" filter="url(#glow)"/>
  <text class="subtle" x="132" y="95" fill="#00d4ff">ν₀ = 1 at J = 0</text>

  <!-- formula annotation inside plot -->
  <text class="form" x="320" y="150">ν = ν₀ · e^(−J)</text>

  <!-- right explanatory panel -->
  <rect class="panel" x="660" y="85" width="320" height="605"/>

  <!-- Definitions -->
  <text class="phead" x="680" y="115">DEFINITIONS</text>
  <text class="ptext" x="680" y="138">Greep (J):</text>
  <text class="ptext" x="680" y="156">total resonant binding —</text>
  <text class="ptext" x="680" y="174">sum of positive-Trouw bonds</text>
  <text class="ptext" x="680" y="192">weighted by Gewenning (Z).</text>

  <text class="ptext" x="680" y="220">Van Motor coefficient (ν):</text>
  <text class="ptext" x="680" y="238">strength of the standing pull</text>
  <text class="ptext" x="680" y="256">toward the unbound (Van) pole.</text>

  <!-- Formula -->
  <text class="phead" x="680" y="286">FORMULA</text>
  <text class="form" x="680" y="308">ν = ν₀ · e^(−J)</text>

  <!-- Key behavior -->
  <text class="phead" x="680" y="338">KEY BEHAVIOR</text>
  <text class="ptext" x="680" y="356">As J increases, ν falls</text>
  <text class="ptext" x="680" y="374">exponentially.</text>
  <text class="ptext" x="680" y="392">The curve approaches ν = 0</text>
  <text class="ptext" x="680" y="410">but never touches it.</text>
  <text class="ptext" x="680" y="428">The Van Motor is never off.</text>
  <text class="annot" x="680" y="448">Suppressed — never abolished.</text>

  <!-- Selected values -->
  <text class="phead" x="680" y="478">SELECTED VALUES</text>
  <text class="mono" x="680" y="500">J = 0    ν = 1.000</text>
  <text class="mono" x="680" y="518">J = 2    ν = 0.135</text>
  <text class="mono" x="680" y="536">J = 4    ν = 0.018</text>
  <text class="mono" x="680" y="554">J = 6    ν = 0.0025</text>
  <text class="mono" x="680" y="572">J = 8    ν = 0.0003</text>
  <text class="mono" x="680" y="590">J = 10   ν = 0.00005</text>

  <!-- Final insight -->
  <text class="pmute" x="680" y="624">A deep bond is not a safe bond;</text>
  <text class="pmute" x="680" y="642">it is a held one.</text>
  <text class="pmute" x="680" y="660">Greep postpones the fall;</text>
  <text class="pmute" x="680" y="678">it does not remove it.</text>
</svg>